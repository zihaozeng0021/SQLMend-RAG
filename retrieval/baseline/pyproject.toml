[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlmend-retrieval"
version = "0.1.0"
description = "Reproducible sparse, dense, and hybrid retrieval baselines for SQLMend-RAG"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "PyYAML==6.0.1",
  "rank-bm25==0.2.2",
  "sentence-transformers==5.1.0",
  "transformers==4.57.6",
  "torch==2.13.0",
  "huggingface-hub==0.36.2",
  "tokenizers==0.22.2",
  "safetensors==0.8.0",
  "scipy==1.13.1",
  "scikit-learn==1.5.1",
  "tqdm==4.66.5",
  "psutil==5.9.0",
  "fastembed==0.8.0",
  "protobuf==5.29.6",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
sqlmend-retrieval = "sqlmend_retrieval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
