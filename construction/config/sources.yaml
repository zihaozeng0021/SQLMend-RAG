manifest_version: 1
project: SQLMendRAG
allowed_dialects:
  - postgresql
  - mysql
  - sqlite
  - mariadb
  - duckdb

collection:
  retries: 4
  connect_timeout_seconds: 20
  read_timeout_seconds: 180
  rate_limit_seconds: 0.5
  user_agent: "SQLMendRAG-university-research/0.1 (reproducible documentation collector)"

sources:
  - id: postgresql_18_6_manual
    source_name: PostgreSQL 18.6 Reference Manual
    source_type: official_docs
    vendor_or_project: PostgreSQL Global Development Group
    dialect: postgresql
    base_url: https://www.postgresql.org/docs/18/
    retrieved_at: "2026-08-27T04:45:30Z"
    license_or_terms_note: PostgreSQL documentation license permits use, copying, modification, and distribution when the copyright and disclaimer notices are retained; see legalnotice.html.
    authority_class: official_project_documentation
    collector_name: postgresql_release_archive
    version: "18.6"
    version_min: "18.6"
    version_max: "18.6"
    version_status: exact
    coverage_tier: current
    collector:
      type: archive
      url: https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.bz2
      archive_format: tar.bz2
      expected_sha256: 555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f
      strip_components: 1
      include:
        - doc/src/sgml/*.sgml
        - doc/src/sgml/*.xml
      exclude:
        - doc/src/sgml/postgres.sgml
        - doc/src/sgml/filelist.sgml
      source_url_template: https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.bz2?member={path}
    path_rules:
      - glob: "**/release*.sgml"
        set:
          source_type: release_notes
          authority_class: official_release_documentation
      - regex: "(?:errcodes|error)"
        set:
          source_type: error_reference
      - regex: "(?:pgupgrade|logical-replication-upgrade|migration)"
        set:
          source_type: migration_guide

